definitions:
  chats.ChatDTO:
    properties:
      id:
        type: integer
      is_selected:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  chats.UpdateChatSelectionRequest:
    properties:
      chat_ids:
        items:
          type: integer
        type: array
    required:
    - chat_ids
    type: object
  handlers.CodeRequest:
    description: Запрос для отправки кода подтверждения из Telegram
    properties:
      code:
        example: "12345"
        type: string
    required:
    - code
    type: object
  handlers.ErrorResponse:
    description: Структура для возврата ошибок
    properties:
      error:
        example: error message
        type: string
    type: object
  handlers.PasswordRequest:
    description: Запрос для отправки пароля двухфакторной аутентификации
    properties:
      password:
        example: my2fapassword
        type: string
    required:
    - password
    type: object
  handlers.PhoneRequest:
    description: Запрос для отправки номера телефона при авторизации
    properties:
      phone_number:
        example: "+1234567890"
        type: string
    required:
    - phone_number
    type: object
  handlers.SessionResponse:
    description: SessionResponse структура для ответа о сессии
    properties:
      auth_state:
        type: string
    type: object
  handlers.TokenResponse:
    description: TokenResponse структура для возврата токена
    properties:
      expires_in:
        type: integer
      token:
        type: string
      token_type:
        type: string
    type: object
  scenarios.CreateScenarioDTO:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      reminder_description_template:
        type: string
      reminder_minutes_before:
        minimum: 0
        type: integer
      reminder_title_template:
        type: string
      trigger_phrase:
        type: string
    required:
    - name
    - reminder_minutes_before
    - reminder_title_template
    - trigger_phrase
    type: object
  scenarios.ScenarioResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      reminder_description_template:
        type: string
      reminder_minutes_before:
        type: integer
      reminder_title_template:
        type: string
      trigger_phrase:
        type: string
      updated_at:
        type: string
    type: object
  scenarios.UpdateScenarioDTO:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      reminder_description_template:
        type: string
      reminder_minutes_before:
        type: integer
      reminder_title_template:
        type: string
      trigger_phrase:
        type: string
    type: object
info:
  contact: {}
paths:
  /auth/session/status:
    get:
      description: Возвращает текущий статус сессии
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить статус сессии
      tags:
      - auth
  /auth/telegram/code:
    post:
      consumes:
      - application/json
      description: Отправляет код подтверждения из Telegram
      parameters:
      - description: Verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Установить код подтверждения
      tags:
      - auth
  /auth/telegram/init:
    post:
      consumes:
      - application/json
      description: Создает Telegram клиент и обновляет статус сессии
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Инициализировать Telegram клиента
      tags:
      - auth
  /auth/telegram/password:
    post:
      consumes:
      - application/json
      description: Отправляет пароль двухфакторной аутентификации
      parameters:
      - description: Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Установить пароль
      tags:
      - auth
  /auth/telegram/phone:
    post:
      consumes:
      - application/json
      description: Отправляет номер телефона для авторизации в Telegram
      parameters:
      - description: Phone number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PhoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Установить номер телефона для Telegram
      tags:
      - auth
  /auth/token:
    post:
      consumes:
      - application/json
      description: Создает JWT токен
      parameters:
      - description: Phone number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PhoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Получить токен авторизации
      tags:
      - auth
  /chats:
    get:
      description: Возвращает список чатов Telegram с информацией о выборе
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chats.ChatDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить список чатов пользователя
      tags:
      - chats
  /chats/selected:
    get:
      description: Возвращает список ID выбранных чатов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                format: int64
                type: integer
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить выбранные чаты
      tags:
      - chats
  /chats/selection:
    post:
      consumes:
      - application/json
      description: Сохраняет список выбранных чатов для анализа
      parameters:
      - description: Список ID чатов
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chats.UpdateChatSelectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Обновить выбранные чаты
      tags:
      - chats
  /ping:
    get:
      description: endpoint для проверки что сервер работает
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Проверка работоспособности API
      tags:
      - health
  /scenarios:
    get:
      description: Возвращает список всех сценариев пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/scenarios.ScenarioResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить все сценарии пользователя
      tags:
      - scenarios
    post:
      consumes:
      - application/json
      description: Создает новый сценарий для пользователя
      parameters:
      - description: Данные сценария
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/scenarios.CreateScenarioDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/scenarios.ScenarioResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Создать новый сценарий
      tags:
      - scenarios
  /scenarios/{id}:
    delete:
      description: Удаляет сценарий пользователя
      parameters:
      - description: ID сценария
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Удалить сценарий
      tags:
      - scenarios
    get:
      description: Возвращает сценарий по ID
      parameters:
      - description: ID сценария
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scenarios.ScenarioResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить сценарий по ID
      tags:
      - scenarios
    put:
      consumes:
      - application/json
      description: Обновляет существующий сценарий
      parameters:
      - description: ID сценария
        in: path
        name: id
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/scenarios.UpdateScenarioDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scenarios.ScenarioResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - Bearer: []
      summary: Обновить сценарий
      tags:
      - scenarios
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
